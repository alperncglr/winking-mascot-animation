[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "meeting-scribe"
version = "0.1.0"
description = "Local-first physical meeting transcription pipeline"
requires-python = ">=3.9"
dependencies = [
  'websockets>=15.0',
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
capture = ["sounddevice>=0.4", "soundfile>=0.12", "numpy>=1.26"]
offline = ["faster-whisper>=1.0"]
diarization = ['pyannote.audio>=4,<5']
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_scribe", "meeting_scribe.*"]
exclude = ["archive*", "runtime*", "storage*", "tests*"]

[tool.setuptools.package-data]
meeting_scribe = ["server/templates/*.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
