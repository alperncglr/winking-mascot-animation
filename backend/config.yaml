app:
  name: t3ai-defter
  host: 0.0.0.0
  port: 8000

paths:
  database: storage/meeting_scribe.sqlite3
  runtime_root: runtime/meetings
  archive_root: archive/meetings

auth:
  dev_started_by_name: Dev Operator
  dev_started_by_id: dev.operator@example.local
  trusted_name_header: x-started-by-name
  trusted_id_header: x-started-by-id
  api_key_env: MEETING_SCRIBE_API_KEY

capture:
  device_name_hint: Jabra Speak2 55
  sample_rate: 16000
  channels: 1
  chunk_seconds: 30

offline:
  whisper_backend: remote_vosk_ws
  whisper_api_base_url: http://10.0.111.32:2700/v1
  whisper_ws_url: ws://10.0.111.32:2700
  whisper_api_timeout_seconds: 300
  whisper_ws_receive_timeout_seconds: 300
  whisper_ws_chunk_bytes: 32000
  whisper_model: large-v3
  whisper_compute_type: float16
  diarizer_backend: pyannote
  pyannote_model: models/pyannote-speaker-diarization-community-1
  hf_token_env: HF_TOKEN
  overlap_min_seconds: 1.0
  pyannote_segmentation_batch_size: 8
  pyannote_embedding_batch_size: 8

live:
  backend: remote_vosk_ws
  whisper_model: large-v3-turbo
  whisper_chunk_seconds: 2.5
  whisper_context_seconds: 10.0
  diarization_backend: remote_diart_ws
  diarization_ws_url: ws://127.0.0.1:2710
  diarization_wait_seconds: 7.0
  sample_rate: 16000
  window_seconds: 10.0
  silence_rms_threshold: 300
  silence_flush_seconds: 1.2
  min_decode_seconds: 1.0

llm:
  base_url: https://t3ai.baykartech.net/Jitsi_Toplanti/v1
  model: t3ai-v2
  api_key_env: COMPANY_LLM_API_KEY
  timeout_seconds: 60
  max_transcript_chars_per_chunk: 24000

runtime_cleanup:
  abandoned_meeting_timeout_hours: 24
  scan_interval_minutes: 60
